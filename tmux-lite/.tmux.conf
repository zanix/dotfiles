# Include base configuration
source-file ~/.config/tmux/base.conf

# Set to tmux* for 256 color support (also keeps home/end working)
set -s default-terminal "tmux-256color"

# Open tmux sessions
bind C-j choose-session

# ╓───── Lightweight status & theme (no plugins required)
# ║ This replaces plugin-provided theming and small helpers with
# ║ built-in tmux formats and tiny shell commands that run via #().
# ╙────────────────────────────────────── ─ ─

# Basic colors (adjust to taste)
set -g status-bg colour235
set -g status-fg colour136
set -g status-style "bg=colour235,fg=colour136"
set -g message-style "bg=colour236,fg=colour166"

set -g status-left-length 60
set -g status-right-length 180

# Left: session + user@host
set -g status-left "#[fg=green] #S #[fg=cyan]#{user}@#{host_short} #[default]"

# Middle: window list (simple, compact)
set -g window-status-format " #[fg=colour250]#I:#W "
set -g window-status-current-format " #[bg=colour28,fg=colour223]#I:#W #[default]"

# Right: current git branch (if any), IP (if any) and date/time
# The git check runs in the current pane path. If git or a repo is missing, it prints nothing.
# IP uses 'hostname -I' fallback (may not be available on very minimal systems).
set -g status-right "#[fg=yellow]#(bash -lc 'cd \"#{pane_current_path}\" 2>/dev/null && command -v git >/dev/null && git rev-parse --abbrev-ref HEAD 2>/dev/null | sed \"s/.*/git:\\0/\" || true') #[fg=cyan]#(hostname -I 2>/dev/null | awk \"{print \$1}\") #[fg=colour136]%Y-%m-%d %H:%M#[default]"
